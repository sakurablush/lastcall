# Dependabot — npm dependency updates (lastcall)

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      testing:
        applies-to: version-updates
        patterns:
          - vitest*
          - '@vitest/*'
      typescript-and-build:
        applies-to: version-updates
        patterns:
          - typescript
          - tsup
          - tsx
      linting-and-formatting:
        applies-to: version-updates
        patterns:
          - eslint*
          - prettier*
          - typescript-eslint*
      docs:
        applies-to: version-updates
        patterns:
          - vitepress
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
