name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch config
        uses: actions/checkout@v6

      - name: Apply path-based labels
        uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
