name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm (trusted publishing requires 11.5.1+)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gate
        run: npm run ci

      - name: Build library
        run: npm run build

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm (OIDC — no NPM_TOKEN)
        run: npm publish --access public

      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        run: node scripts/extract-changelog-section.mjs "${GITHUB_REF#refs/tags/v}"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: lastcall ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
